<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="思いつきを書き留め、フォルダで育てるアイデア共有ボード"
    />
    <title>Idea Shelf</title>
    <meta name="theme-color" content="#df5b3e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Idea Shelf" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon-precomposed" sizes="180x180" href="/apple-touch-icon-precomposed.png" />
    <link rel="manifest" id="app-manifest" href="./site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script>
      (() => {
        const manifest = document.querySelector("#app-manifest");
        const params = new URLSearchParams(location.search);
        const board = params.get("board");
        const key = params.get("key");
        if (!board || !key) return;

        const mode = params.get("mode") === "view" ? "view" : "edit";
        manifest.href = `/site.webmanifest?${new URLSearchParams({
          board,
          key,
          mode,
        })}`;
      })();
    </script>
    <script src="./app.js?v=20260625-1"></script>
  </body>
</html>
