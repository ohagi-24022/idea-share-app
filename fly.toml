# fly.toml app configuration file generated for late-feather-4535 on 2026-06-11T12:37:05+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'late-feather-4535'
primary_region = 'nrt'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[env]
  PORT = "3000"
  DB_PATH = "/data/ideashelf.db" # DBを永続化フォルダに保存する

[mounts]
  source = "sqlite_data"
  destination = "/data"